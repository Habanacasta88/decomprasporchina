# Rate limiting zone — 10 requests/second per IP, burst of 20
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Redirect www to non-www
server {
    listen 80;
    server_name www.decomprasporchina.com;
    return 301 https://decomprasporchina.com$request_uri;
}

server {
    listen 80 default_server;
    server_name decomprasporchina.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    limit_req_status 429;

    # ─── Security headers ───
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://www.googletagservices.com https://adservice.google.com https://adservice.google.es https://partner.googleadservices.com https://tpc.googlesyndication.com https://www.google-analytics.com https://www.googletagmanager.com https://fundingchoicesmessages.google.com https://ep1.adtrafficquality.google; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googlesyndication.com https://*.doubleclick.net https://s.click.aliexpress.com https://www.amazon.es https://m.media-amazon.com https://images-eu.ssl-images-amazon.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://fundingchoicesmessages.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://*.google.com https://*.google-analytics.com https://fundingchoicesmessages.google.com https://ep1.adtrafficquality.google; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ─── Block sensitive paths ───
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* ^/(wp-admin|wp-login|xmlrpc|wp-json|wp-includes) {
        return 404;
    }

    # ─── Cache static assets ───
    # NOTE: add_header in a location block overrides server-level add_header.
    # We must repeat security headers here.
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    }

    # ─── HTML pages — short cache ───
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    }

    # ─── Pretty URLs (Astro SSG) ───
    # error_page mantiene el status 404 real sirviendo la página custom.
    # /404.html NO va en try_files: ahí se servía como archivo normal → soft-404 con HTTP 200.
    # Cache-Control no-cache: el HTML revalida siempre (304 si no cambió). Sin esta cabecera,
    # los navegadores aplican heuristic caching (~10% del age desde Last-Modified) y muestran
    # contenido viejo días después de un deploy (incidente 2026-06-08).
    location / {
        error_page 404 /404.html;
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://www.googletagservices.com https://adservice.google.com https://adservice.google.es https://partner.googleadservices.com https://tpc.googlesyndication.com https://www.google-analytics.com https://www.googletagmanager.com https://fundingchoicesmessages.google.com https://ep1.adtrafficquality.google; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googlesyndication.com https://*.doubleclick.net https://s.click.aliexpress.com https://www.amazon.es https://m.media-amazon.com https://images-eu.ssl-images-amazon.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://fundingchoicesmessages.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://*.google.com https://*.google-analytics.com https://fundingchoicesmessages.google.com https://ep1.adtrafficquality.google; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # ─── Gzip ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ─── WordPress redirects (old URLs with /wp-content/uploads/) ───
    location /wp-content/uploads/ {
        rewrite ^/wp-content/uploads/(.*)$ /images/$1 permanent;
    }

    # ─── Redirect old WordPress category-prefixed URLs → clean post slugs ───
    location ~* ^/(tiendas-chinas|accesorios|ropa|calzado|tecnologia|deporte|xiaomi|blog)/([^/]+)/?$ {
        return 301 https://decomprasporchina.com/$2/;
    }
}
